<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{fill:#111827;stroke:#94a3b8;stroke-width:1.5}
      .mid{fill:#1e1b4b;stroke:#818cf8;stroke-width:1.5}
      .core{fill:#022c22;stroke:#34d399;stroke-width:1.5}
      .dash{fill:#000;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
      .t{font-size:15px;font-weight:700;fill:#f8fafc;text-anchor:middle}
      .s{font-size:12.5px;fill:#cbd5e1;text-anchor:middle}
      .ln{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .pl{stroke:#94a3b8;stroke-width:1.6;fill:none}
      .lb{font-size:12px;fill:#94a3b8;text-anchor:start}
    </style>
  </defs>
  <rect width="900" height="720" fill="#000"/>

  <rect class="box" x="300" y="20" width="300" height="50" rx="10"/>
  <text class="t" x="450" y="50">HTTP Client</text>
  <path class="ln" d="M450 70V105"/>
  <text class="lb" x="462" y="93">Bearer &lt;token&gt;</text>

  <rect class="mid" x="150" y="105" width="600" height="80" rx="10"/>
  <text class="t" x="450" y="135">Middleware (internal/httpapi)</text>
  <text class="s" x="450" y="158">recover · access log (no paths) · security headers</text>
  <text class="s" x="450" y="175">rate limit: token bucket per IP</text>
  <path class="pl" d="M450 185V200M127 200H772"/>
  <path class="ln" d="M127 200V215"/><path class="ln" d="M342 200V215"/>
  <path class="ln" d="M557 200V215"/><path class="ln" d="M772 200V215"/>

  <g>
    <rect class="mid" x="30"  y="215" width="195" height="90" rx="10"/>
    <text class="t" x="127" y="243">POST</text><text class="s" x="127" y="263">/upload</text><text class="s" x="127" y="282">multipart: file | text</text>
    <rect class="mid" x="245" y="215" width="195" height="90" rx="10"/>
    <text class="t" x="342" y="243">PUT</text><text class="s" x="342" y="263">/upload/{name}</text><text class="s" x="342" y="282">raw body (curl -T)</text>
    <rect class="mid" x="460" y="215" width="195" height="90" rx="10"/>
    <text class="t" x="557" y="243">GET</text><text class="s" x="557" y="263">/f/{id}</text><text class="s" x="557" y="282">download, Range</text>
    <rect class="mid" x="675" y="215" width="195" height="90" rx="10"/>
    <text class="t" x="772" y="243">DELETE</text><text class="s" x="772" y="263">/f/{id}</text><text class="s" x="772" y="282">X-Delete-Token</text>
  </g>
  <path class="pl" d="M127 305V335M342 305V335M557 305V335M772 305V335M127 335H772"/>
  <path class="ln" d="M450 335V355"/>

  <rect class="core" x="250" y="355" width="400" height="85" rx="10"/>
  <text class="t" x="450" y="385">Service (internal/service)</text>
  <text class="s" x="450" y="408">TTL rules · random ids · delete tokens (SHA-256)</text>
  <text class="s" x="450" y="426">filename sanitising</text>
  <path class="ln" d="M450 440V480"/>

  <rect class="core" x="250" y="480" width="400" height="70" rx="10"/>
  <text class="t" x="450" y="510">storage.Storage (interface)</text>
  <text class="s" x="450" y="531">Put · Stat · Open · Delete · Sweep</text>

  <rect class="box" x="690" y="380" width="180" height="60" rx="10"/>
  <text class="t" x="780" y="406">Sweeper</text>
  <text class="s" x="780" y="425">every 1 min</text>
  <path class="ln" d="M780 440V515H650"/>

  <path class="ln" d="M350 550V610"/>
  <path class="ln" d="M550 550V610" stroke-dasharray="6 4"/>

  <rect class="core" x="150" y="610" width="400" height="90" rx="10"/>
  <text class="t" x="350" y="640">FS (implemented)</text>
  <text class="s" x="350" y="662">DATA_DIR/ab/&lt;id&gt;.bin + &lt;id&gt;.json</text>
  <text class="s" x="350" y="680">atomic writes · quota · orphan cleanup</text>

  <rect class="dash" x="580" y="610" width="290" height="90" rx="10"/>
  <text class="t" x="725" y="640">S3 / Postgres / Redis</text>
  <text class="s" x="725" y="662">your own Storage implementation</text>
  <text class="s" x="725" y="680">for horizontal scaling</text>
</svg>
